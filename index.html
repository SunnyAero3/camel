<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Camel OS</title>

  <link rel="stylesheet" href="https://unpkg.com/7.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- 🪟 MAIN CONTROL WINDOW (CENTER FLOAT) -->
  <div id="uiWindow" class="window active">
    <div class="title-bar">
      <div class="title-bar-text">🐫 Camel Generator</div>
    </div>

    <div class="window-body">
      <button id="spawnBtn">Generate Camel</button>
      <div id="counter">Camels: 0</div>
    </div>
  </div>

  <!-- 🐫 CAMELS -->
  <div id="camelArea"></div>

  <!-- 🪟 WINDOWS -->
  <div id="windowArea"></div>

  <!-- 🔊 SOUND -->
  <audio id="sound" src="sound.mp3"></audio>

  <script src="script.js"></script>
</body>
</html>
