<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Camel</title>
  <link rel="icon" type="image/png" href="camel.png">
  <link rel="stylesheet" href="https://unpkg.com/7.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background">
    <div id="uiWindow" class="window glass active" style="max-width: 300px;">
      <div class="title-bar">
        <div class="title-bar-text">Camel Generator</div>
        <div class="title-bar-controls">
          <button aria-label="Minimize"></button>
          <button aria-label="Close"></button>
        </div>
      </div>
      <div class="window-body has-space">
        <div style="display:flex; gap:6px;">
          <button id="spawnBtn">Generate Camel</button>
          <a href="download.html"><button>Download camel.exe</button></a>
        </div>
        <div style="display:flex; gap:6px; margin-top:6px;">
          <button id="clearBtn">Clear Windows</button>
          <button id="toggleBtn">Stop/Start Windows</button>
        </div>
        <div style="display:flex; gap:6px; margin-top:6px;">
          <button id="musicBtn">Stop/Start Music</button>
          <button id="moveBtn">Stop/Start Moving</button>
        </div>
        <div id="counter" style="margin-top:6px;">Camels: 0</div>
      </div>
    </div>
  </div>
  <div id="camelArea"></div>
  <div id="windowArea"></div>
  <audio id="sound" src="sound.mp3"></audio>
  <script src="script.js"></script>

</html>
